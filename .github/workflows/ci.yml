name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - name: Enable unprivileged user namespaces for the validation sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage the validation sandbox executable outside the denied source tree
        run: |
          install -d -m 700 /var/tmp/herdr-codex-sandbox-ci
          install -m 700 node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex /var/tmp/herdr-codex-sandbox-ci/codex
          echo "HERDR_TEST_SANDBOX_BIN=/var/tmp/herdr-codex-sandbox-ci/codex" >> "$GITHUB_ENV"
      - if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
      - if: github.event_name == 'push'
        run: git diff --check HEAD^..HEAD
      - run: npm run verify
